biershop_free_shipping.settings:
  path: '/admin/commerce/config/shipping/free-shipping'
  defaults:
    _form: '\Drupal\biershop_free_shipping\Form\FreeShippingSettingsForm'
    _title: 'Free shipping'
  requirements:
    _permission: 'administer biershop free shipping'

biershop_free_shipping.report:
  path: '/admin/commerce/config/shipping/free-shipping/overview'
  defaults:
    _controller: '\Drupal\biershop_free_shipping\Controller\FreeShippingReportController::overview'
    _title: 'Free shipping overview'
  requirements:
    _permission: 'view biershop free shipping report'
